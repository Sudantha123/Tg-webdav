name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - run: go mod tidy
      - run: go test ./...
      - run: mkdir -p dist
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/tg-webdav-linux-amd64 ./cmd/tg-webdav
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/tg-webdav-linux-arm64 ./cmd/tg-webdav
      - uses: actions/upload-artifact@v4
        with:
          name: tg-webdav-binaries
          path: dist/
